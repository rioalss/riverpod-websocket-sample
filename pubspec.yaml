name: example_websocket
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  centrifuge: ^0.17.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.2
  dartz: ^0.10.1
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_polyline_points: ^3.1.0
  flutter_riverpod: ^3.1.0
  flutter_svg: ^2.2.3
  freezed_annotation: ^3.1.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  go_router: ^17.0.1
  google_maps_flutter: ^2.14.0
  google_places_flutter: ^2.1.1
  json_annotation: ^4.9.0
  riverpod_annotation: ^4.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: null
  change_app_package_name: ^1.5.0
  flutter_gen_runner: null
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  injectable_generator: null
  json_serializable: ^6.10.0
  riverpod_generator: null

flutter_gen:
  output: lib/shared/gen/
  integrations:
    flutter_svg: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env.dev
    - .env.prod
    - .env.staging
    - assets/images/
    - assets/icons/
    - assets/fonts/
