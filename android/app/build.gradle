plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Dev
def envDevProperties = new Properties()
def envDevPropertiesFile = rootProject.file('../.env.dev')
if (envDevPropertiesFile.exists()) {
    envDevPropertiesFile.withReader('UTF-8') { reader ->
        envDevProperties.load(reader)
    }
}

def googleMapApiKeyDev = envDevProperties.getProperty('GOOGLE_MAP_API_KEY')
if (googleMapApiKeyDev==null) {
    println "⚠️ [DEV] GOOGLE_MAP_API_KEY not found in .env.dev, using dummy key"
}

// Staging
def envStagingProperties = new Properties()
def envStagingPropertiesFile = rootProject.file('../.env.staging')
if (envStagingPropertiesFile.exists()) {
    envStagingPropertiesFile.withReader('UTF-8') { reader ->
        envStagingProperties.load(reader)
    }
}

def googleMapApiKeyStaging = envStagingProperties.getProperty('GOOGLE_MAP_API_KEY')
if (googleMapApiKeyStaging==null) {
    println "⚠️ [STAGING] GOOGLE_MAP_API_KEY not found in .env.staging, using dummy key"
}

// Prod
def envProdProperties = new Properties()
def envProdPropertiesFile = rootProject.file('../.env.prod')
if (envProdPropertiesFile.exists()) {
    envProdPropertiesFile.withReader('UTF-8') { reader ->
        envProdProperties.load(reader)
    }
}

def googleMapApiKeyProd = envProdProperties.getProperty('GOOGLE_MAP_API_KEY')
if (googleMapApiKeyProd==null) {
    println "⚠️ [PROD] GOOGLE_MAP_API_KEY not found in .env.prod, using dummy key"
}





android {
    namespace "com.example.example_websocket"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.example.example_websocket"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    flavorDimensions "default"
    productFlavors {
        production {
            dimension "default"
            applicationIdSuffix ""
            manifestPlaceholders = [
                appName:"Example WebSocket",  
                GOOGLE_MAP_API_KEY: googleMapApiKeyProd
                ]
        }
        staging {
            dimension "default"
            applicationIdSuffix ".staging"
            manifestPlaceholders = [
                appName:"[STG] Example WebSocket",  
                GOOGLE_MAP_API_KEY: googleMapApiKeyStaging
                ]
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            manifestPlaceholders = [
                appName:"[DEV] Example WebSocket",  
                GOOGLE_MAP_API_KEY: googleMapApiKeyDev
                ]
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
